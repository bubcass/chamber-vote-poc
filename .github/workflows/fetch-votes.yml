name: Fetch votes data and deploy site

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-votes.yml"
      - "src/**"
      - "index.html"
      - "package.json"
      - "package-lock.json"
  schedule:
    # Spread runs across the hour and avoid GitHub Actions' busiest times.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vote-data-refresh
  cancel-in-progress: false

jobs:
  fetch-build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Fetch latest votes
        run: npm run fetch:votes

      - name: Commit updated data if changed
        id: commit_data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add public/chambers/dail/data/voteDetails.json public/chambers/seanad/data/voteDetails.json

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Update chamber vote data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install deps
        if: github.event_name == 'push' || steps.commit_data.outputs.changed == 'true'
        run: npm ci

      - name: Build site
        if: github.event_name == 'push' || steps.commit_data.outputs.changed == 'true'
        run: npm run build

      - name: Configure authenticated remote for deploy
        if: github.event_name == 'push' || steps.commit_data.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git

      - name: Deploy site
        if: github.event_name == 'push' || steps.commit_data.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm run deploy
